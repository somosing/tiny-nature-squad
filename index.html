<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tiny Nature Squad</title>
  <style>
    :root {
      --ink: #26331b;
      --soft: #687653;
      --sun: #ffcc32;
      --green1: #bff098;
      --green2: #7bd69c;
      --panel: rgba(255,255,255,0.78);
      --shadow: rgba(40, 70, 30, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: ui-rounded, "SF Pro Rounded", "Comic Sans MS", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 14%, rgba(255, 224, 79, .65) 0 10%, transparent 11%),
        radial-gradient(circle at 88% 18%, rgba(183, 237, 255, .85) 0 14%, transparent 15%),
        linear-gradient(160deg, #fff7cf, #d9f9c9 45%, #b7edff);
    }

    #startScreen {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .start-card {
      width: min(92vw, 430px);
      text-align: center;
      padding: 26px 20px 22px;
      border-radius: 32px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 70px var(--shadow);
      border: 2px solid rgba(255,255,255,.85);
    }

    .start-emoji {
      font-size: 5rem;
      line-height: 1;
      filter: drop-shadow(0 8px 12px rgba(40,70,30,.18));
    }

    h1 {
      margin: 12px 0 6px;
      font-size: clamp(2rem, 9vw, 3.1rem);
      line-height: .95;
      letter-spacing: -0.06em;
    }

    .start-card p {
      color: var(--soft);
      font-weight: 800;
      line-height: 1.35;
      margin: 10px 0 20px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-weight: 950;
      color: var(--ink);
      border-radius: 999px;
      padding: 13px 18px;
      background: linear-gradient(180deg, #ffe777, #ffbd2e);
      box-shadow: 0 8px 0 #cc8a11, 0 16px 28px rgba(40, 70, 30, .18);
      transform: translateY(0);
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #cc8a11, 0 8px 18px rgba(40, 70, 30, .2);
    }

    #gameScreen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(160deg, var(--green1), var(--green2));
    }

    body.playing #startScreen {
      display: none;
    }

    body.playing #gameScreen {
      display: block;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: block;
      background:
        linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(160deg, #b9ea8f, #82d978 58%, #70d19d);
      background-size: 28px 28px, 28px 28px, 100% 100%;
    }

    .hud {
      position: fixed;
      left: 10px;
      right: 10px;
      top: max(8px, env(safe-area-inset-top));
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      gap: 6px;
    }

    .pill {
      pointer-events: none;
      background: rgba(255,255,255,.24);
      border: 1px solid rgba(255,255,255,.28);
      backdrop-filter: blur(6px);
      border-radius: 999px;
      padding: 6px 10px;
      box-shadow: none;
      font-weight: 950;
      font-size: .78rem;
      white-space: nowrap;
      opacity: .48;
    }

    #exitBtn {
      pointer-events: auto;
      padding: 6px 10px;
      font-size: .72rem;
      color: rgba(38,51,27,.55);
      background: rgba(255,255,255,.20);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: none;
      opacity: .42;
      backdrop-filter: blur(6px);
    }

    #exitBtn:active {
      transform: none;
      box-shadow: none;
      opacity: .75;
    }

    .toast {
      position: fixed;
      z-index: 6;
      left: 50%;
      top: calc(max(58px, env(safe-area-inset-top) + 50px));
      transform: translateX(-50%) translateY(-18px);
      opacity: 0;
      background: rgba(255,255,255,.34);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 950;
      box-shadow: none;
      opacity: 0;
      white-space: nowrap;
      transition: .24s ease;
    }

    .toast.show {
      opacity: .62;
      transform: translateX(-50%) translateY(0);
    }



    .end-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      place-items: center;
      padding: 22px;
      background: rgba(255, 253, 242, .62);
      backdrop-filter: blur(10px);
    }

    .end-overlay.show {
      display: grid;
    }

    .end-card {
      width: min(88vw, 380px);
      text-align: center;
      border-radius: 30px;
      background: rgba(255,255,255,.84);
      border: 2px solid rgba(255,255,255,.92);
      box-shadow: 0 24px 70px var(--shadow);
      padding: 24px 18px 20px;
      animation: pop .32s ease both;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.9) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .end-emoji {
      font-size: 4.5rem;
      line-height: 1;
    }

    .end-card h2 {
      margin: 8px 0;
      font-size: 1.7rem;
      letter-spacing: -0.05em;
    }

    .end-card p {
      margin: 8px 0 16px;
      color: var(--soft);
      font-weight: 800;
      line-height: 1.35;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .secondary {
      background: linear-gradient(180deg, #ffffff, #e9ffd9);
      box-shadow: 0 8px 0 #8dbc76, 0 16px 28px rgba(40, 70, 30, .13);
    }

  </style>
</head>
<body>
  <section id="startScreen">
    <div class="start-card">
      <div class="start-emoji">🐛🌻🐞</div>
      <h1>Tiny Nature Squad</h1>
      <p>Swipe anywhere to move the worm. Eat sunflowers. Avoid ladybugs. Become butterfly-level ridiculous.</p>
      <button id="startBtn">Start chaos</button>
    </div>
  </section>

  <section id="gameScreen">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="pill">🌻 Score <span id="score">0</span></div>
      <div class="pill">🦋 <span id="flowers">0</span>/12</div>
      <button id="exitBtn" class="secondary">Exit</button>
    </div>

    <div id="toast" class="toast">Tiny squad activated</div>

    <div id="endOverlay" class="end-overlay">
      <div class="end-card">
        <div id="endEmoji" class="end-emoji">🐛</div>
        <h2 id="endTitle">Squad report</h2>
        <p id="endText">Nature happened.</p>
        <div class="row">
          <button id="restartBtn">Again again</button>
          <button id="copyBtn" class="secondary">Copy score</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const startBtn = document.getElementById("startBtn");
    const exitBtn = document.getElementById("exitBtn");
    const restartBtn = document.getElementById("restartBtn");
    const copyBtn = document.getElementById("copyBtn");
    const scoreEl = document.getElementById("score");
    const flowersEl = document.getElementById("flowers");
    const toast = document.getElementById("toast");
    const endOverlay = document.getElementById("endOverlay");
    const endEmoji = document.getElementById("endEmoji");
    const endTitle = document.getElementById("endTitle");
    const endText = document.getElementById("endText");

    const GOAL = 12;
    let DPR = 1;
    let CELL = 28;
    let COLS = 18;
    let ROWS = 28;

    let worm = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let flower = null;
    let bugs = [];
    let score = 0;
    let flowers = 0;
    let butterfly = false;
    let running = false;
    let timer = null;
    let speed = 130;
    let particles = [];

    const messages = [
      "Yee 😂",
      "Sunflower acquired 🌻",
      "Worm business continues 🐛",
      "Tiny squad activated",
      "Nature is happening",
      "Snack mission critical",
      "Scientifically stupid",
      "Ladybug has no license 🐞",
      "Garden chaos certified",
      "Very official nature"
    ];

    function setupCanvas() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * DPR);
      canvas.height = Math.floor(window.innerHeight * DPR);

      // Rectangular full-screen grid. This is the important fix.
      const targetCellCss = Math.max(22, Math.min(32, Math.floor(window.innerWidth / 14)));
      CELL = targetCellCss * DPR;
      COLS = Math.floor(canvas.width / CELL);
      ROWS = Math.floor(canvas.height / CELL);

      // Keep enough grid space on very small screens.
      COLS = Math.max(12, COLS);
      ROWS = Math.max(18, ROWS);

      draw();
    }

    function boardW() { return COLS * CELL; }
    function boardH() { return ROWS * CELL; }
    function offX() { return (canvas.width - boardW()) / 2; }
    function offY() { return (canvas.height - boardH()) / 2; }
    function cx(x) { return offX() + x * CELL + CELL / 2; }
    function cy(y) { return offY() + y * CELL + CELL / 2; }

    async function requestFullScreen() {
      try {
        if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch {
        // iPhone Safari may not allow true fullscreen. The page still fills 100dvh.
      }
    }

    async function startGame() {
      document.body.classList.add("playing");
      await requestFullScreen();
      setupCanvas();
      resetGame();
      running = true;
      endOverlay.classList.remove("show");
      showToast("Tiny squad activated 🐛");
      clearInterval(timer);
      timer = setInterval(tick, speed);
    }

    function resetGame() {
      const startX = Math.floor(COLS / 2);
      const startY = Math.floor(ROWS / 2);

      worm = [
        { x: startX, y: startY },
        { x: startX - 1, y: startY },
        { x: startX - 2, y: startY }
      ];

      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      flowers = 0;
      butterfly = false;
      speed = 130;
      particles = [];
      bugs = [];
      for (let i = 0; i < 4; i++) bugs.push(randomEmpty());
      flower = randomEmpty();
      updateHud();
      draw();
    }

    function tick() {
      dir = nextDir;
      const head = {
        x: (worm[0].x + dir.x + COLS) % COLS,
        y: (worm[0].y + dir.y + ROWS) % ROWS
      };

      if (worm.some((p, i) => i > 0 && same(p, head))) {
        endGame("self");
        return;
      }

      if (bugs.some(b => same(b, head))) {
        endGame("bug");
        return;
      }

      worm.unshift(head);

      if (same(head, flower)) {
        score += butterfly ? 15 : 10;
        flowers += 1;
        burst(head.x, head.y, butterfly ? "🦋" : "🌻");
        showToast(messages[Math.floor(Math.random() * messages.length)]);
        flower = randomEmpty();

        if (flowers % 4 === 0 && bugs.length < 9 && !butterfly) {
          bugs.push(randomEmpty());
          showToast("A suspicious ladybug entered 🐞");
        }

        if (flowers >= GOAL && !butterfly) {
          butterfly = true;
          showToast("WORM EVOLVED INTO BUTTERFLY 🦋");
          burst(head.x, head.y, "🦋", 26);
        }

        updateSpeed();
      } else {
        worm.pop();
      }

      if (Math.random() < 0.18) moveBugs();
      updateParticles();
      updateHud();
      draw();
    }

    function updateSpeed() {
      clearInterval(timer);
      speed = butterfly ? 95 : Math.max(72, 130 - Math.floor(score / 30) * 8);
      timer = setInterval(tick, speed);
    }

    function moveBugs() {
      const steps = [
        {x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}, {x:0,y:0}
      ];

      bugs = bugs.map(b => {
        const s = steps[Math.floor(Math.random() * steps.length)];
        const nb = { x: (b.x + s.x + COLS) % COLS, y: (b.y + s.y + ROWS) % ROWS };
        if (worm.some(w => same(w, nb)) || same(nb, flower)) return b;
        return nb;
      });
    }

    function endGame(reason) {
      running = false;
      clearInterval(timer);

      if (butterfly) {
        endEmoji.textContent = "🦋";
        endTitle.textContent = "Butterfly-level chaos";
        endText.textContent = `Score ${score}. Tiny Nature Squad became majestic and unnecessary.`;
      } else if (reason === "bug") {
        endEmoji.textContent = "🐞";
        endTitle.textContent = "Ladybug incident report";
        endText.textContent = `Score ${score}. A ladybug caused legal problems. Very tiny. Very serious.`;
      } else {
        endEmoji.textContent = "🐛";
        endTitle.textContent = "Worm got confused";
        endText.textContent = `Score ${score}. The worm investigated itself and found more worm.`;
      }

      endOverlay.classList.add("show");
    }

    function exitGame() {
      running = false;
      clearInterval(timer);
      document.body.classList.remove("playing");
      endOverlay.classList.remove("show");
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      flowersEl.textContent = Math.min(flowers, GOAL);
    }

    function draw() {
      if (!ctx || !canvas.width) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGarden();
      if (flower) drawFlower(flower.x, flower.y);
      bugs.forEach(drawLadybug);
      drawWorm();
      drawParticles();
      if (butterfly && worm[0]) drawAura();
    }

    function drawGarden() {
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, "#bff098");
      grad.addColorStop(0.55, "#82d978");
      grad.addColorStop(1, "#70d19d");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1 * DPR;

      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(offX() + x * CELL, offY());
        ctx.lineTo(offX() + x * CELL, offY() + boardH());
        ctx.stroke();
      }

      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(offX(), offY() + y * CELL);
        ctx.lineTo(offX() + boardW(), offY() + y * CELL);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = .16;
      ctx.font = `${CELL * .55}px serif`;
      for (let i = 0; i < 42; i++) {
        const x = (i * 173) % canvas.width;
        const y = (i * 97) % canvas.height;
        ctx.fillText(i % 2 ? "🌱" : "·", x, y);
      }
      ctx.restore();
    }

    function drawWorm() {
      if (!worm.length) return;

      if (butterfly) {
        drawButterflyWorm();
        return;
      }

      worm.forEach((p, i) => {
        const x = cx(p.x);
        const y = cy(p.y);
        const r = CELL * (i === 0 ? .46 : .38);

        ctx.save();
        ctx.shadowColor = "rgba(35,75,30,.25)";
        ctx.shadowBlur = 7 * DPR;
        ctx.shadowOffsetY = 3 * DPR;

        const g = ctx.createRadialGradient(x - r*.35, y - r*.35, 2, x, y, r);
        g.addColorStop(0, i === 0 ? "#c6ff92" : "#abef7a");
        g.addColorStop(1, i === 0 ? "#52ad45" : "#469b3b");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();

        if (i === 0) drawFace(x, y);
        ctx.restore();
      });
    }

    function drawButterflyWorm() {
      const h = worm[0];
      const hx = cx(h.x);
      const hy = cy(h.y);

      ctx.save();
      ctx.shadowColor = "rgba(101,57,166,.25)";
      ctx.shadowBlur = 12 * DPR;
      ctx.shadowOffsetY = 4 * DPR;

      wing(hx - CELL*.38, hy, CELL*.58, -0.75, "rgba(255,126,182,.78)");
      wing(hx + CELL*.38, hy, CELL*.58, 0.75, "rgba(155,93,229,.80)");

      worm.slice(0, 8).forEach((p, i) => {
        const x = cx(p.x);
        const y = cy(p.y);
        const r = CELL * (i === 0 ? .41 : .31);
        const g = ctx.createRadialGradient(x - r*.35, y - r*.35, 2, x, y, r);
        g.addColorStop(0, "#ffe5ff");
        g.addColorStop(1, i === 0 ? "#9b5de5" : "#6fcf97");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        if (i === 0) drawButterflyFace(x, y);
      });

      ctx.restore();
    }

    function wing(x, y, s, tilt, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x, y - s*.12, s*.55, s*.85, tilt, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,.32)";
      ctx.beginPath();
      ctx.arc(x, y - s*.25, s*.14, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawFace(x, y) {
      const ex = dir.x !== 0 ? dir.x * CELL*.15 : CELL*.13;
      const ey = dir.y !== 0 ? dir.y * CELL*.15 : -CELL*.08;

      ctx.fillStyle = "#26331b";
      ctx.beginPath();
      ctx.arc(x + ex - CELL*.10, y + ey, CELL*.055, 0, Math.PI * 2);
      ctx.arc(x + ex + CELL*.10, y + ey, CELL*.055, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#26331b";
      ctx.lineWidth = 2 * DPR;
      ctx.beginPath();
      ctx.arc(x + dir.x*CELL*.12, y + dir.y*CELL*.12 + 3*DPR, CELL*.12, .15*Math.PI, .85*Math.PI);
      ctx.stroke();

      ctx.strokeStyle = "#448a38";
      ctx.beginPath();
      ctx.moveTo(x - CELL*.13, y - CELL*.36);
      ctx.quadraticCurveTo(x - CELL*.24, y - CELL*.58, x - CELL*.36, y - CELL*.46);
      ctx.moveTo(x + CELL*.13, y - CELL*.36);
      ctx.quadraticCurveTo(x + CELL*.24, y - CELL*.58, x + CELL*.36, y - CELL*.46);
      ctx.stroke();
    }

    function drawButterflyFace(x, y) {
      ctx.fillStyle = "#271a38";
      ctx.beginPath();
      ctx.arc(x - CELL*.11, y - CELL*.03, CELL*.055, 0, Math.PI * 2);
      ctx.arc(x + CELL*.11, y - CELL*.03, CELL*.055, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#271a38";
      ctx.lineWidth = 2 * DPR;
      ctx.beginPath();
      ctx.arc(x, y + CELL*.07, CELL*.13, .15*Math.PI, .85*Math.PI);
      ctx.stroke();
    }

    function drawFlower(gx, gy) {
      const x = cx(gx);
      const y = cy(gy);

      ctx.save();
      ctx.shadowColor = "rgba(135,88,4,.22)";
      ctx.shadowBlur = 8 * DPR;
      ctx.shadowOffsetY = 3 * DPR;

      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.fillStyle = i % 2 ? "#ffda3d" : "#fff06a";
        ctx.beginPath();
        ctx.ellipse(
          x + Math.cos(a) * CELL*.22,
          y + Math.sin(a) * CELL*.22,
          CELL*.14,
          CELL*.24,
          a,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      ctx.fillStyle = "#865b18";
      ctx.beginPath();
      ctx.arc(x, y, CELL*.17, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawLadybug(b) {
      const x = cx(b.x);
      const y = cy(b.y);

      ctx.save();
      ctx.shadowColor = "rgba(72,13,18,.25)";
      ctx.shadowBlur = 7 * DPR;
      ctx.shadowOffsetY = 3 * DPR;

      ctx.fillStyle = "#2b1d1d";
      ctx.beginPath();
      ctx.arc(x, y - CELL*.22, CELL*.16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#e63946";
      ctx.beginPath();
      ctx.ellipse(x, y + CELL*.05, CELL*.36, CELL*.32, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#2b1d1d";
      ctx.lineWidth = 2 * DPR;
      ctx.beginPath();
      ctx.moveTo(x, y - CELL*.25);
      ctx.lineTo(x, y + CELL*.34);
      ctx.stroke();

      ctx.fillStyle = "#2b1d1d";
      [[-.16,-.02],[.16,-.02],[-.22,.16],[.22,.16],[0,.24]].forEach(([sx, sy]) => {
        ctx.beginPath();
        ctx.arc(x + sx*CELL, y + sy*CELL, CELL*.052, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    function drawAura() {
      const h = worm[0];
      const x = cx(h.x);
      const y = cy(h.y);

      ctx.save();
      ctx.globalAlpha = .24 + Math.sin(Date.now()/180) * .04;
      const g = ctx.createRadialGradient(x, y, CELL*.2, x, y, CELL*3.2);
      g.addColorStop(0, "#fff");
      g.addColorStop(.35, "#ff7eb6");
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, CELL*3.2, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    function burst(gx, gy, emoji, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: cx(gx),
          y: cy(gy),
          vx: (Math.random() - .5) * CELL * .18,
          vy: (Math.random() - .5) * CELL * .18,
          life: 28 + Math.random() * 14,
          emoji
        });
      }
    }

    function updateParticles() {
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += .05 * DPR;
        p.life -= 1;
      });
    }

    function drawParticles() {
      ctx.save();
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 42);
        ctx.font = `${CELL*.45}px serif`;
        ctx.fillText(p.emoji, p.x, p.y);
      });
      ctx.restore();
    }

    function randomEmpty() {
      let c;
      do {
        c = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (
        worm.some(w => same(w, c)) ||
        bugs.some(b => same(b, c)) ||
        (flower && same(flower, c))
      );
      return c;
    }

    function same(a, b) {
      return a && b && a.x === b.x && a.y === b.y;
    }

    function setDir(name) {
      const map = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      const d = map[name];
      if (!d) return;
      if (d.x === -dir.x && d.y === -dir.y) return;
      nextDir = d;
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toast.classList.remove("show"), 900);
    }


    window.addEventListener("keydown", e => {
      const map = {
        ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
        w: "up", s: "down", a: "left", d: "right"
      };
      if (map[e.key]) {
        e.preventDefault();
        setDir(map[e.key]);
      }
    });

    let touchStart = null;

    window.addEventListener("touchstart", e => {
      const t = e.changedTouches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    window.addEventListener("touchmove", e => {
      e.preventDefault();
    }, { passive: false });

    window.addEventListener("touchend", e => {
      if (!touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? "right" : "left");
      else setDir(dy > 0 ? "down" : "up");
      touchStart = null;
    }, { passive: true });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);
    exitBtn.addEventListener("click", exitGame);

    copyBtn.addEventListener("click", async () => {
      const text = `Tiny Nature Squad score: ${score} 🌻🐛🐞${butterfly ? " Butterfly mode achieved 🦋" : ""}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("Score copied 🌻");
      } catch {
        showToast("Copy failed, but nature tried");
      }
    });

    window.addEventListener("resize", () => {
      if (!document.body.classList.contains("playing")) return;
      setupCanvas();
      if (running) draw();
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        if (!document.body.classList.contains("playing")) return;
        setupCanvas();
      }, 250);
    });
  </script>
</body>
</html>
